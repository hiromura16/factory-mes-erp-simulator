[project]
name = 'factory-sql-data-loader'
version = "0.3.0"
description = "Independent manufacturing factory data producer"
requires-python = ">=3.12,<3.15"
dependencies = [
    'fastapi==0.165.0',
    'uvicorn==0.54.0',
    'pymssql==2.4.6',
    "sqlalchemy>=2.1,<2.2",
    "oracledb>=3,<5",
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "cryptography>=46,<50",
    "pyodbc>=5.2,<6",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
